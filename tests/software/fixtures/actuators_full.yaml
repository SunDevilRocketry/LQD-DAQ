# tests/software/fixtures/actuators_full.yaml
#
# The repo's actuators.yaml with step counts, rates and `normal` filled in
# (values arbitrary), so the stepper path is tested.

actuators:
  - id: fuel_purge
    type: binary_dio
    normal: closed
    dio: EIO1
  - id: lox_purge
    type: binary_dio
    normal: closed
    dio: EIO2
  - id: fuel_press
    type: binary_dio
    normal: closed
    dio: EIO3
  - id: lox_press
    type: binary_dio
    normal: closed
    dio: EIO4
  - id: fuel_vent
    type: binary_dio
    normal: open
    dio: EIO7
  - id: tank_depress
    type: binary_dio
    normal: open
    dio: CIO1
  - id: ignition_arm
    type: binary_dio
    dio: MIO0
  - id: ignition_fire
    type: binary_dio
    dio: MIO1

  - id: lox_main
    type: pulse_stepper
    normal: closed
    step_dio: FIO3
    dir_dio: FIO2
    steps_open: 400
    steps_close: 400
    pulse_freq_hz: 2000
    position_feedback:
      enabled: true
      source: pos_lox_main

  - id: fuel_main
    type: pulse_stepper
    normal: closed
    step_dio: FIO0
    dir_dio: FIO1
    steps_open: 400
    steps_close: 400
    pulse_freq_hz: 2000
    position_feedback:
      enabled: true
      source: pos_fuel_main
