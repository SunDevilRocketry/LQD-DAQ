# sequences/abort.yaml: abort timeline, [t_s, actuator_id, state] from
# /abort; 1 = energise.
# PLACEHOLDER ordering from the old Goondaq DAQ; Liquids confirms it.
# Refused while lox_main/fuel_main are unwired, so today an abort is
# all-off (no purge). Once runnable, closing the mains is this file's job:
# all-off leaves a stepper where it is.

post_record_seconds: 5.0

steps:
  - [0.00, "ignition_fire", 0]
  - [0.00, "ignition_arm",  0]
  - [0.00, "lox_main",   0]
  - [0.00, "fuel_main",  0]
  - [0.00, "lox_press",  0]
  - [0.00, "fuel_press", 0]
  - [0.05, "lox_purge",  1]
  - [0.05, "fuel_purge", 1]
  - [0.10, "tank_depress", 0]
  - [0.10, "fuel_vent",  0]
  - [5.00, "lox_purge",  0]
  - [5.00, "fuel_purge", 0]
