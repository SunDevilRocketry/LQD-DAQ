# sequences/fire.yaml: hot-fire timeline, [t_s, actuator_id, state] from
# T=0 at /fire; 1 = energise. Step names are /sequence/step targets; a step
# starts at its earliest action.
# PLACEHOLDER timings from the old Goondaq DAQ; Liquids confirms the real
# sequence. Arm leads fire (RC on-delay) and fire releases first.

post_record_seconds: 5.0

steps:
  - name: purge_open
    actions:
      - [1.10, "lox_purge",  1]
      - [1.10, "fuel_purge", 1]
  - name: ignition_arm
    actions:
      - [3.00, "ignition_arm", 1]
  - name: ignition_on
    actions:
      - [4.00, "ignition_fire", 1]
  - name: ignition_off
    actions:
      - [4.50, "ignition_fire", 0]
      - [4.60, "ignition_arm",  0]
  - name: purge_close
    actions:
      - [4.90, "lox_purge",  0]
      - [4.90, "fuel_purge", 0]
  - name: main_valves_open
    actions:
      - [5.00, "lox_main",  1]
      - [5.05, "fuel_main", 1]
  - name: main_valves_close
    actions:
      - [15.00, "lox_main",  0]
      - [15.10, "fuel_main", 0]
  - name: purge_reopen
    actions:
      - [15.10, "lox_purge",  1]
      - [15.20, "fuel_purge", 1]
  - name: press_vent_close
    actions:
      - [16.00, "lox_press",  0]
      - [16.00, "fuel_press", 0]
      - [16.00, "tank_depress", 0]
      - [16.00, "fuel_vent",  0]
  - name: purge_final_close
    actions:
      - [21.00, "lox_purge",  0]
      - [21.00, "fuel_purge", 0]
