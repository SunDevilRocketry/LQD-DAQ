# sequences/fire.yaml
#
# Hot-fire autosequence timeline.
#   state 1 = energise / open
#   state 0 = de-energise / closed / safe
#
# Actuator names must exactly match _ACTUATOR_CHANNELS in hardware/interface.py:
#   LOx Press, Fuel Press, LOx Purge, Fuel Purge,
#   LOx Main, Fuel Main, LOx Vent, Fuel Vent, Ignition
#
# Times are relative to T=0 (moment FIRE is confirmed).
#
# Format is as follows: [elapsed_seconds, actuator_name, state]
# Sourced from prior FIRE_SEQUENCE.

post_record_seconds: 5.0

steps:
  - [1.10,  "LOx Purge",  1]
  - [1.10,  "Fuel Purge", 1]
  - [4.00,  "Ignition",   1]
  - [4.50,  "Ignition",   0]
  - [4.90,  "LOx Purge",  0]
  - [4.90,  "Fuel Purge", 0]
  - [5.00,  "LOx Main",   1]
  - [5.05,  "Fuel Main",  1]
  - [15.00, "LOx Main",   0]
  - [15.10, "LOx Purge",  1]
  - [15.10, "Fuel Main",  0]
  - [15.20, "Fuel Purge", 1]
  - [16.00, "LOx Press",  0]
  - [16.00, "Fuel Press", 0]
  - [16.00, "LOx Vent",   0]
  - [16.00, "Fuel Vent",  0]
  - [21.00, "LOx Purge",  0]
  - [21.00, "Fuel Purge", 0]