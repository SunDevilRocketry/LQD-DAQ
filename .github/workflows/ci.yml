name: CI

# Runs the mock-hardware test suite (tests/software/ + test_calculations.py)
# on every push and pull request. tests/hardware_live/ is excluded.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # lets you trigger a run manually from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package + test dependencies
        run: pip install -e .[test]

      - name: Run software test suite (mock hardware only)
        run: python -m pytest tests/software tests/test_calculations.py -v
