name: CI

# Mock-hardware tests (tests/software/ + test_calculations.py) on every push
# and pull request. tests/hardware_live/ needs a T7 and is excluded.
#
# Three kinds of job run in parallel:
#   lint    - errors only, once
#   test    - the suite once per supported Python (3.11 to latest)
#   flakes  - the threaded suites three more times, on one Python

on:
  push:
    branches: [main, legacy_cart]
  pull_request:
    branches: [main, legacy_cart]
  workflow_dispatch:   # lets you trigger a run manually from the Actions tab

permissions:
  contents: read

# Superseding a push mid-run makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  LATEST_PYTHON: "3.15"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.LATEST_PYTHON }}
      # F is pyflakes (unused/undefined names, bad imports); E9 is syntax and
      # IO errors.
      - run: pip install ruff && ruff check . --select F,E9

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # pyproject's floor (requires-python) up to the latest release.
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - run: pip install -e .[test]
      - run: python -m pytest tests/software tests/test_calculations.py -q --durations=10

  flakes:
    # Timing flakes come from a loaded runner, not the Python version, so one
    # version is enough. test_calculations is pure functions and isn't repeated.
    name: flake check (3 repeats)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.LATEST_PYTHON }}
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - run: pip install -e .[test]
      - run: |
          for i in 1 2 3; do
            echo "::group::repeat run $i"
            python -m pytest tests/software -q
            echo "::endgroup::"
          done
