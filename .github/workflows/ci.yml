name: CI

# Runs the mock-hardware test suite (tests/software/ + test_calculations.py)
# on every push and pull request. tests/hardware_live/ is excluded.

on:
  push:
    branches: [main, legacy_cart]
  pull_request:
    branches: [main, legacy_cart]
  workflow_dispatch:   # lets you trigger a run manually from the Actions tab

permissions:
  contents: read

# Superseding a push mid-run makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      # Real errors only: F is pyflakes (unused/undefined names, bad
      # imports), E9 is syntax and IO errors.
      - name: Lint (errors only)
        run: |
          pip install ruff
          ruff check . --select F,E9

      - name: Run software test suite (mock hardware only)
        run: python -m pytest tests/software tests/test_calculations.py -v

      # A shared runner is a loaded machine, which is where timing-sensitive
      # tests fail and a single green run does not prove they will not. This
      # repeats the threaded suites only; test_calculations is pure functions.
      - name: Re-run the threaded suites to catch flakes
        run: |
          for i in 1 2 3; do
            echo "::group::repeat run $i"
            python -m pytest tests/software -q
            echo "::endgroup::"
          done
