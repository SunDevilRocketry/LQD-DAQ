# channels.yaml: sensors and the T7 pin each is read on.
# Pins follow docs/schematics/legacy_cart_2026-10-16.pdf; a null pin means
# unwired.
# Pressures report in Pa; calibration and thresholds stay authored in psi.

channels:
  # -- PTs: Omega PX309-2KG5V, gauge. pt4-pt7 are spare slots. --
  - id: pt0
    type: pt_direct
    unit: Pa
    ain: AIN0
    cal_ref: pt0
  - id: pt1
    type: pt_direct
    unit: Pa
    ain: AIN4
    cal_ref: pt1
  - id: pt2
    type: pt_direct
    unit: Pa
    ain: AIN6
    cal_ref: pt2
  - id: pt3
    type: pt_direct
    unit: Pa
    ain: AIN8
    cal_ref: pt3
  - id: pt4
    type: pt_direct
    unit: Pa
    ain: null
    cal_ref: pt4
    active: false
    notes: "spare slot"
  - id: pt5
    type: pt_direct
    unit: Pa
    ain: null
    cal_ref: pt5
    active: false
    notes: "spare slot"
  - id: pt6
    type: pt_direct
    unit: Pa
    ain: null
    cal_ref: pt6
    active: false
    notes: "spare slot"
  - id: pt7
    type: pt_direct
    unit: Pa
    ain: null
    cal_ref: pt7
    active: false
    notes: "spare slot"

  # -- dPTs: QDW90A across the injector orifices; feed mass flow. --
  - id: dpt0
    type: pt_differential
    unit: Pa
    ain: AIN10
    cal_ref: dpt0
    notes: "LOX injector orifice dP; 0-0.4 MPa over 0-10 V per seller listing, UNVERIFIED"
  - id: dpt1
    type: pt_differential
    unit: Pa
    ain: AIN12
    cal_ref: dpt1
    notes: "fuel injector orifice dP; 0-0.4 MPa over 0-10 V per seller listing, UNVERIFIED"

  # -- TC: Type T on the T7 screw terminals. Feeds LOX density (estimate). --
  - id: tc0
    type: tc_differential
    unit: celsius
    ain_pos: AIN2
    ain_neg: AIN3
    cal_ref: tc0
    active: true

  # -- Load cells: Pushton S1 2000 kg via a 0-10 V weight transmitter. --
  - id: lc0
    type: lc_direct
    unit: lbf
    ain: AIN1
    cal_ref: lc0
    active: true
  - id: lc1
    type: lc_direct
    unit: lbf
    ain: AIN5
    cal_ref: lc1
    active: true

  # -- Photogates (L0004): stepper travel counts, telemetry only. --
  - id: pos_lox_main
    type: photogate_counter
    unit: counts
    dio: FIO6
    cal_ref: null
    active: false
    notes: "L0004 photogate, tested working; inactive until stepper analysis uses it"
  - id: pos_fuel_main
    type: photogate_counter
    unit: counts
    dio: FIO7
    cal_ref: null
    active: false
    notes: "L0004 photogate, tested working; inactive until stepper analysis uses it"
