# actuators.yaml: valves, igniter and steppers, and the T7 line driving each.
# Lines follow docs/schematics/legacy_cart_2026-10-16.pdf; a null line means
# unwired. 1 = energised everywhere here; the driver applies the active-low
# inversion. `normal` is the de-energised state, reported only.

actuators:
  # -- Valves, via 70G-OAC5 modules on the RB12 --
  - id: fuel_purge
    type: binary_dio
    normal: null
    dio: EIO1          # RB12 slot R1, ASCO 8320G184
    relay: "70G-OAC5"
  - id: lox_purge
    type: binary_dio
    normal: null
    dio: EIO2          # RB12 slot R2, ASCO 8320G184
    relay: "70G-OAC5"
  - id: fuel_press
    type: binary_dio
    normal: null
    dio: EIO3          # RB12 slot R3, Atlantic 4V210-08 -> AT actuator
    relay: "70G-OAC5"
  - id: lox_press
    type: binary_dio
    normal: null
    dio: EIO4          # RB12 slot R4, Atlantic 4V210-08 -> AT actuator
    relay: "70G-OAC5"
  - id: fuel_vent
    type: binary_dio
    normal: null
    dio: EIO7          # RB12 slot R7, ASCO 8320G184
    relay: "70G-OAC5"
  - id: tank_depress
    type: binary_dio
    normal: null
    dio: CIO1          # RB12 slot R9, Atlantic 4V210-08 -> AT actuator
    relay: "70G-OAC5"

  # -- Igniter: fires only with ARM_n and FIRE_n both low; arm first (RC delay). --
  - id: ignition_arm
    type: binary_dio
    normal: null
    dio: MIO0          # CB37 pin 5
    notes: "igniter ARM_n -> Qa gate; energise at least ~100 ms before ignition_fire"
  - id: ignition_fire
    type: binary_dio
    normal: null
    dio: MIO1          # CB37 pin 4
    notes: "igniter FIRE_n -> Qb gate; fires only while ignition_arm is also energised"

  # -- Mains: DM860T steppers (v1 LOX, v3 fuel). ENA unconnected. --
  - id: lox_main
    type: pulse_stepper
    normal: null
    step_dio: FIO3
    dir_dio: FIO2
    steps_open: null
    steps_close: null
    pulse_freq_hz: null
    notes: "no accel ramp; start with a conservative pulse rate"
    position_feedback:
      enabled: false
      source: pos_lox_main
      note: "reported via channels.yaml only, not closed-loop"

  - id: fuel_main
    type: pulse_stepper
    normal: null
    step_dio: FIO0
    dir_dio: FIO1
    steps_open: null
    steps_close: null
    pulse_freq_hz: null
    position_feedback:
      enabled: false
      source: pos_fuel_main
      note: "reported via channels.yaml only, not closed-loop"
