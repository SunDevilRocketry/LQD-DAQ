[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lqd-daq"
dynamic = ["version"]
description = "Ground controller data acquisition and sequencing service for the Sun Devil Rocketry liquids feed system."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
    { name = "Sun Devil Rocketry - Liquids" },
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

# Runtime dependencies only. Test-only deps (pytest, httpx) live in the
# [test] extra below, since they aren't needed to actually run the service.
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "PyYAML>=6.0",
    "labjack-ljm>=1.23.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

# Optional convenience: after `pip install -e .`, `lqd-daq` on the command
# line does the same thing as `python -m daq`. `python -m daq` still works
[project.scripts]
lqd-daq = "daq.__main__:main"

# Read __version__ from daq/__init__.py
[tool.setuptools.dynamic]
version = { attr = "daq.__version__" }

[tool.setuptools.packages.find]
include = ["daq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]