# config.yaml: server, paths, derived-value inputs and display thresholds.

server:
  host: "0.0.0.0"       # all interfaces; closed network only
  port: 8000
  log_level: "warning"  # uvicorn: debug | info | warning | error

paths:
  output_dir:    "data"                  # CSV recordings
  sequence_dir:  "sequences"
  cal_file:      "daq/calibration.json"
  channels:      "channels.yaml"
  actuators:     "actuators.yaml"
  lox_table:     "daq/LOX_table_100_0-260_99R.csv"  # LOX density; source UNVERIFIED

stream:
  target_hz: 500       # not read; the driver fixes 500 Hz

# Injector mass flow and O/F (calculated), published under `derived`.
# A null or inactive input makes that output null. orifice_count must match
# the injector's element count. Cd values are Goondaq's, not measured here.
derived:
  lox:
    dp_channel:            dpt0
    inlet_temp_channel:    tc0      # for LOX density
    orifice_diameter_in:   0.199
    orifice_count:         1
    discharge_coefficient: 0.6
  fuel:
    dp_channel:            dpt1
    orifice_diameter_in:   0.280
    orifice_count:         1
    discharge_coefficient: 0.67
    density_kg_m3:         800.0    # IPA, approximate

# Display bands only (SR 3.2.2 / 3.2.3.1): nothing acts on them. Keyed by
# channel id, in psig / C / lbf. No entry = UNCONFIGURED. Empty until
# Liquids supplies bounds. Format:
#   pt0:
#     normal:  [<lo>, <hi>]
#     warning: [<lo>, <hi>]
thresholds: {}
