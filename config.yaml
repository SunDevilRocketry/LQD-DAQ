# config.yaml
#
# Liquids DAQ system configuration.
# Edit here for hardware-specific tuning and safety boundaries.

# -- SERVER CONFIGURATION ------------------------------------

server:
  host: "0.0.0.0"       # Bind to all network interfaces for multi-console access
  port: 8000
  log_level: "warning"  # Uvicorn logging verbosity: debug | info | warning | error

# -- FILESYSTEM PATHS ----------------------------------------

paths:
  output_dir:    "data"                  # Target directory for CSV telemetry logs
  sequence_dir:  "sequences"             # Directory containing fire.yaml and abort.yaml
  cal_file:      "daq/calibration.json"  # Active calibration coefficients file
  channels:      "channels.yaml"         # Sensor manifest for this cart
  actuators:     "actuators.yaml"        # Actuator manifest for this cart

# -- DATA ACQUISITION STREAM ---------------------------------
stream:
  target_hz: 500       # Requested hardware sampling rate (negotiated at start)

# -- SAFETY THRESHOLDS (SR 3.2.2 / SR 3.2.3.1) ---------------
#
# Keyed by channel id from channels.yaml.
# Bounds are authored in calibrated units: pressures (psig), temperatures
# (°C), forces (lbf). Pressure bands are converted to Pa on load, matching
# the Pa the pipeline reports.
#
# GUI State Mapping (Dashboard readingStatus.ts):
#   - Within [normal]:                        NOMINAL
#   - Outside [normal] but within [warning]:  CAUTION
#   - Outside [warning]:                      WARNING (interlock hazard)
#
# A channel with no entry here reports status: UNASSIGNED - nobody has set
# bounds for it yet.
#
# EMPTY ON PURPOSE. Real psi/°C bounds for this cart must come from the Liquids review.
# Fill in per channel as:
#
#   pt0:
#     normal:  [<lo_psi>, <hi_psi>]
#     warning: [<lo_psi>, <hi_psi>]
#
thresholds: {}
